name: Publicar servidor de salas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Validar configuração
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Configure o secret SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Configure a variável SUPABASE_PROJECT_REF.'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Conferir interface da CLI
        run: |
          supabase --help
          supabase functions deploy --help
      - name: Publicar função multiplayer
        run: supabase functions deploy game --project-ref "$SUPABASE_PROJECT_REF"
